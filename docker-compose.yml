services:
  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    expose:
      - "80"
    volumes:
      - ./:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  umami:
    # Umami 3.4.0, pinned to the verified image digest.
    image: ghcr.io/umami-software/umami@sha256:85909afc45bdcda1917394594a087421fdbb05610fded0fa9f6fb861abb2f367
    restart: unless-stopped
    init: true
    ports:
      - "192.168.1.170:3003:3000"
    env_file: .env.umami
    environment:
      DISABLE_TELEMETRY: "1"
    depends_on:
      umami-db:
        condition: service_healthy
    networks:
      - web
      - analytics-db
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent http://localhost:3000/api/heartbeat || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s

  umami-db:
    image: postgres:15-alpine
    restart: unless-stopped
    env_file: .env.umami
    volumes:
      - umami-db-data:/var/lib/postgresql/data
    networks:
      - analytics-db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U umami -d umami"]
      interval: 10s
      timeout: 5s
      retries: 5

  updater:
    image: alpine/git:2.49.1
    restart: unless-stopped
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    working_dir: /workspace
    environment:
      UPDATE_INTERVAL_SECONDS: ${UPDATE_INTERVAL_SECONDS:-300}
      GIT_FETCH_URL: ${GIT_FETCH_URL:-https://github.com/mariadelvalle-portfolio/Portfolio.git}
    volumes:
      - ./:/workspace
    entrypoint: ["/bin/sh"]
    command:
      - -c
      - |
        set -eu
        while true; do
          if git fetch "$$GIT_FETCH_URL" main:refs/remotes/origin/main; then
            local_commit=$$(git rev-parse main)
            remote_commit=$$(git rev-parse origin/main)
            if [ "$$local_commit" = "$$remote_commit" ]; then
              echo "Repository already up to date at $$local_commit"
            elif git merge-base --is-ancestor "$$local_commit" "$$remote_commit"; then
              if git diff --quiet && git diff --cached --quiet; then
                git merge --ff-only origin/main
                echo "Repository updated to $$remote_commit"
              else
                echo "Local tracked changes detected; update skipped"
              fi
            else
              echo "Local branch is ahead or diverged; update skipped"
            fi
          else
            echo "Unable to fetch origin/main; retrying later"
          fi
          sleep "$$UPDATE_INTERVAL_SECONDS"
        done
    networks:
      - web

  cloudflared:
    image: cloudflare/cloudflared:2026.8.2
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN:?Set CLOUDFLARE_TUNNEL_TOKEN in .env or the shell environment}
    depends_on:
      nginx:
        condition: service_healthy
    networks:
      - web

networks:
  web:
    driver: bridge
  analytics-db:
    internal: true

volumes:
  umami-db-data:
