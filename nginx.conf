server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve dynamically so the portfolio stays online if Umami restarts.
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $umami http://umami:3000;

    location = /analytics/script.js {
        proxy_pass $umami/script.js;
        proxy_set_header Host $host;
    }

    location = /analytics/api/send {
        limit_except POST { deny all; }
        proxy_pass $umami/api/send;
        proxy_set_header Host $host;
        # Public traffic arrives through the Cloudflare Tunnel.
        proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-IPCountry $http_cf_ipcountry;
    }

    location /analytics/ { return 404; }

    # The checkout contains operational files as well as public assets.
    location ~ /\. { return 404; }
    location ~* \.(?:py|conf|yml|yaml|md|sql)$ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }
}
